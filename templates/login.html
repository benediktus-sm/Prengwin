<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - AgriTwin AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body>

  <div class="login-page">
    <div class="login-visual">
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <div class="visual-logo">🌾 AgriTwin AI</div>
        <h2>Selamat Datang Kembali</h2>
        <p>Pantau lahan, prediksi risiko, dan optimalkan hasil panen padimu dengan bantuan AI.</p>
      </div>
    </div>

    <div class="login-form-wrapper">
      <div class="login-card">
<a href="{{ url_for('home') }}" class="back-link">← Kembali ke Beranda</a>
        <h1>Masuk ke Dashboard</h1>
        <p class="login-subtitle">Masukkan akun kamu untuk melanjutkan</p>

        {% if error %}
        <div class="alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" placeholder="Masukkan password" required />
              <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember" />
              <span>Ingat saya</span>
            </label>
          </div>

          <button type="submit" class="btn-login">Masuk →</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById('password');
      const btn = document.querySelector('.toggle-password');
      if (pass.type === 'password') {
        pass.type = 'text';
        btn.textContent = '🙈';
      } else {
        pass.type = 'password';
        btn.textContent = '👁️';
      }
    }
  </script>

</body>
</html>
